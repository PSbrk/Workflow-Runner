<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workflow Runner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Workflow Runner</h1>
    <div class="controls">
      <label for="wf-select">Workflow</label>
      <select id="wf-select" aria-label="Select workflow template"></select>
      <label for="instance-select">Instance</label>
      <select id="instance-select" aria-label="Select instance"></select>
      <span class="new-dropdown">
        <button id="new-btn" type="button" aria-haspopup="true" aria-expanded="false" title="Create a new template or instance">+ New ▾</button>
        <div id="new-menu" class="dropdown-menu hidden" role="menu">
          <button type="button" data-new="workflow" role="menuitem">Workflow (template)</button>
          <button type="button" data-new="instance" role="menuitem">Instance</button>
        </div>
      </span>
      <button id="edit-btn"    type="button" title="Edit the selected template">Edit</button>
      <button id="reset-btn"   type="button" title="Reset progress on the open instance">Reset</button>
      <button id="import-btn"  type="button" title="Import templates from a JSON file">Import</button>
      <button id="export-btn"  type="button" title="Export all templates to a JSON file">Export</button>
      <input id="import-file" type="file" accept=".json,application/json" style="display:none">
    </div>
  </header>

  <main>
    <section id="status-bar"   class="status-bar hidden"   role="status"></section>
    <section id="errors-bar"   class="errors-bar hidden"   role="alert"></section>
    <section id="warnings-bar" class="warnings-bar hidden"></section>

    <!-- Run view: single-card "flashcard" UI for the open INSTANCE -->
    <section id="run-view">
      <div class="run-shell">
        <div class="run-header">
          <div class="run-titles">
            <div id="run-title" class="run-title"></div>
            <div id="run-subtitle" class="run-subtitle"></div>
          </div>
          <div class="run-actions">
            <button id="rename-btn" type="button" class="ghost-btn hidden" title="Rename this instance">Rename</button>
            <button id="delete-btn" type="button" class="ghost-btn-danger hidden" title="Delete this instance">Delete instance</button>
          </div>
        </div>
        <div id="run-trail" class="run-trail"></div>
        <div id="flashcard" class="flashcard"></div>
        <div id="run-progress" class="run-progress"></div>
      </div>
    </section>

    <!-- New-instance modal -->
    <div id="new-instance-modal" class="modal hidden" role="dialog" aria-labelledby="ni-heading">
      <div class="modal-backdrop"></div>
      <div class="modal-panel">
        <h3 id="ni-heading">Create a new instance</h3>
        <div class="modal-field">
          <label for="ni-template">1. Which workflow would you like to use?</label>
          <select id="ni-template"></select>
          <div id="ni-template-warn" class="modal-warn hidden"></div>
        </div>
        <div class="modal-field">
          <label for="ni-title">2. What would you like this instance to be titled?</label>
          <input id="ni-title" type="text" placeholder="e.g. DLT-Longbridge Renewal" autocomplete="off">
        </div>
        <div class="modal-actions">
          <button id="ni-cancel" type="button">Cancel</button>
          <button id="ni-create" type="button" class="btn-primary">Create instance</button>
        </div>
      </div>
    </div>

    <!-- Edit view -->
    <section id="edit-view" class="hidden">
      <div class="edit-split">
        <div class="edit-pane">
          <div class="edit-pane-head">
            <strong>Editor</strong>
            <div class="tabs" role="tablist">
              <button id="ed-tab-canvas" type="button" class="tab active" role="tab">Canvas</button>
              <button id="ed-tab-form"   type="button" class="tab"        role="tab">Form</button>
              <button id="ed-tab-json"   type="button" class="tab"        role="tab">Raw JSON</button>
            </div>
            <button id="ed-close-editor" type="button" class="pane-close" title="Close editor (Esc)" aria-label="Close editor">✕</button>
          </div>

          <!-- Canvas tab -->
          <div id="ed-canvas" class="ed-canvas">
            <div class="canvas-meta">
              <label class="ed-field">
                <span class="ed-label">ID</span>
                <input id="ed-id-canvas" type="text" autocomplete="off" spellcheck="false" placeholder="my-workflow">
              </label>
              <label class="ed-field">
                <span class="ed-label">Title</span>
                <input id="ed-title-canvas" type="text" autocomplete="off" placeholder="My Workflow">
              </label>
            </div>
            <div class="canvas-toolbar">
              <button class="palette-btn" data-shape="action"  type="button">
                <span class="shape-icon-mini sm-action"></span> Action
              </button>
              <button class="palette-btn" data-shape="decision" type="button">
                <span class="shape-icon-mini sm-decision"></span> Decision
              </button>
              <button class="palette-btn" data-shape="wait" type="button">
                <span class="shape-icon-mini sm-wait"></span> Wait
              </button>
              <span class="toolbar-spacer"></span>
              <span class="toolbar-hint">Drag to move • <strong>+</strong> connects • <strong>⋯</strong> edits • <strong>✕</strong> deletes • click a line to select then <strong>✕</strong> to remove</span>
              <div class="canvas-zoom">
                <button id="canvas-zoom-out" class="zoom-step" type="button" title="Zoom out">−</button>
                <input id="canvas-zoom" type="range" min="25" max="200" step="5" value="100" aria-label="Zoom">
                <button id="canvas-zoom-in"  class="zoom-step" type="button" title="Zoom in">+</button>
                <button id="canvas-zoom-reset" class="zoom-pct" type="button" title="Reset to 100%">100%</button>
              </div>
            </div>
            <div class="canvas-viewport">
              <svg id="canvas-svg" class="canvas-svg" tabindex="0">
                <defs>
                  <marker id="cv-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
                  </marker>
                </defs>
              </svg>
            </div>
            <div id="canvas-validation" class="ed-validation canvas-validation"></div>
          </div>

          <!-- Form tab -->
          <div id="ed-form" class="ed-form hidden">
            <div class="ed-meta">
              <label class="ed-field">
                <span class="ed-label">ID</span>
                <input id="ed-id" type="text" autocomplete="off" spellcheck="false" placeholder="my-workflow">
              </label>
              <label class="ed-field">
                <span class="ed-label">Title</span>
                <input id="ed-title" type="text" autocomplete="off" placeholder="My Workflow">
              </label>
            </div>

            <div id="ed-validation" class="ed-validation"></div>

            <ol id="ed-steps" class="ed-steps"></ol>

            <button id="ed-add-step" type="button" class="ed-add-step">+ Add step</button>
          </div>

          <!-- Raw JSON tab -->
          <div id="ed-json" class="ed-json hidden">
            <textarea id="ed-json-text" spellcheck="false" autocomplete="off"></textarea>
            <div id="ed-json-status" class="ed-json-status"></div>
          </div>

          <div class="ed-footer">
            <button id="ed-save"     type="button" class="btn-primary">Save</button>
            <button id="ed-save-close" type="button" class="btn-primary-outline">Save &amp; close</button>
            <button id="ed-save-as"  type="button">Save as new…</button>
            <button id="ed-cancel"   type="button">Cancel</button>
            <span id="ed-save-status" class="ed-save-status hidden"></span>
            <span class="ed-spacer"></span>
            <button id="ed-delete"   type="button" class="btn-danger">Delete workflow</button>
          </div>
        </div>

      </div>
    </section>
  </main>

  <script src="validator.js"></script>
  <script src="instances.js"></script>
  <script src="builtin-workflows.js"></script>
  <script src="templates.js"></script>
  <script src="editor-canvas.js"></script>
  <script src="editor.js"></script>
  <script src="app.js"></script>
</body>
</html>
